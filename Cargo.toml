[package]
name = "patchify-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0"

[dependencies]
anyhow = "1.0.100"
clap = {version = "4", features = ["derive"]}
mimalloc = { version = "0.1", features = ["v3"] }
quinn = { version = "0.11", features = ["rustls"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["log", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zerocopy = "0.8"
